openapi: 3.0.3
info:
  title: FindIt Core Service API
  version: 1.0.0
servers:
  - url: http://localhost:4001

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK

  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password]
              properties:
                fullName:
                  type: string
                  example: Test User
                email:
                  type: string
                  example: test@uni.lk
                password:
                  type: string
                  example: Password123!
      responses:
        "201":
          description: Created
        "409":
          description: Email already in use
        "400":
          description: Validation error

  /auth/login:
    post:
      summary: Login and get JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: test@uni.lk
                password:
                  type: string
                  example: Password123!
      responses:
        "200":
          description: OK
        "401":
          description: Invalid credentials
        "400":
          description: Validation error

  /posts:
    post:
      summary: Create a lost or found post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostInput"
      responses:
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
    get:
      summary: List posts with filters
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [LOST, FOUND]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: location
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [OPEN, CLOSED]
        - in: query
          name: mine
          schema:
            type: boolean
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized for mine=true

  /posts/{id}:
    get:
      summary: Get a post by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not found
    delete:
      summary: Delete a post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /posts/{id}/close:
    patch:
      summary: Close a post
      security:
        - bearerAuth: []
        - internalServiceKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalServiceKey:
      type: apiKey
      in: header
      name: x-internal-service-key
  schemas:
    CreatePostInput:
      type: object
      required: [type, category, location, date, description]
      properties:
        type:
          type: string
          enum: [LOST, FOUND]
        category:
          type: string
          example: Laptop
        location:
          type: string
          example: Library
        date:
          type: string
          format: date-time
          example: 2026-03-15T10:30:00.000Z
        description:
          type: string
          example: Black Dell laptop with stickers
        imageUrl:
          type: string
          nullable: true
