openapi: 3.0.3
info:
  title: FindIt Core Service API
  version: 1.0.0

servers:
  - url: /

tags:
  - name: Health
  - name: Auth

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: OK

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - password
              properties:
                fullName:
                  type: string
                  example: Bhanuka Fernando
                email:
                  type: string
                  format: email
                  example: bhanuka@gmail.com
                password:
                  type: string
                  example: Test@1234
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Bad request
        "409":
          description: Email already exists

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: bhanuka@gmail.com
                password:
                  type: string
                  example: Test@1234
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials