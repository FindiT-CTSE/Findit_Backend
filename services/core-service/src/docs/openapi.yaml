openapi: 3.0.3
info:
  title: FindIt Core Service API
  version: 1.0.0
servers:
  - url: http://localhost:4001

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK

  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password]
              properties:
                fullName:
                  type: string
                  example: Test User
                email:
                  type: string
                  example: test@uni.lk
                password:
                  type: string
                  example: Password123!
      responses:
        "201":
          description: Created
        "409":
          description: Email already in use
        "400":
          description: Validation error

  /auth/login:
    post:
      summary: Login and get JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: test@uni.lk
                password:
                  type: string
                  example: Password123!
      responses:
        "200":
          description: OK
        "401":
          description: Invalid credentials
        "400":
          description: Validation error